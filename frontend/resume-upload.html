<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Management – CareerConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header id="main-header"></header>

  <main class="section-sm">
    <div class="container container-narrow">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem;">
          Resume Management
        </h1>
        <p style="color: var(--text-muted);">
          Upload and manage your PDF resumes. Selected resumes will be attached when you submit applications.
        </p>
      </div>

      <!-- Upload Zone Card -->
      <div class="card" style="margin-bottom: 2.5rem; padding: 2rem; border: 2px dashed var(--primary-border); background: var(--primary-light);">
        <form id="resume-upload-form">
          <div style="text-align: center; max-width: 480px; margin: 0 auto;">
            <div style="width: 58px; height: 58px; border-radius: 50%; background: #ffffff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1rem; box-shadow: var(--shadow-sm);">
              📄
            </div>
            <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.4rem;">
              Upload New PDF Resume
            </h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">
              Supports Adobe PDF documents (.pdf) up to 5 MB in size.
            </p>

            <div style="margin-bottom: 1.25rem;">
              <input type="file" id="resume-file-input" accept=".pdf,application/pdf" style="display: none;" required>
              <label for="resume-file-input" class="btn btn-secondary" style="cursor: pointer; background: #ffffff;">
                Choose PDF File
              </label>
              <div id="file-chosen-name" style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-main); font-weight: 600;">
                No file chosen
              </div>
            </div>

            <button type="submit" id="upload-resume-btn" class="btn btn-primary btn-block">
              Upload PDF Resume
            </button>
          </div>
        </form>
      </div>

      <!-- Uploaded Resumes List -->
      <div>
        <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin-bottom: 1rem;">
          Your Stored Resumes
        </h3>

        <div id="resumes-list-container">
          <!-- Dynamically populated from MongoDB -->
        </div>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/resumes.js"></script>
</body>
</html>
