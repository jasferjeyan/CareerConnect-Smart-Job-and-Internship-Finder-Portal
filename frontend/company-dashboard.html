<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Dashboard – CareerConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header id="main-header"></header>

  <main class="section">
    <div class="container">
      <h1>Company Dashboard</h1>

      <section id="profile-section" style="margin-bottom:2rem;">
        <h2>Profile</h2>
        <div id="company-profile"></div>
        <button id="edit-profile-btn" class="btn btn-primary" style="margin-top:0.5rem;">Edit Profile</button>
      </section>

      <section id="stats-section">
        <h2>Statistics</h2>
        <ul id="stats-list"></ul>
      </section>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/companyDashboard.js"></script>
</body>
</html>
