<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Applicants – CareerConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header id="main-header"></header>

  <main class="section-sm">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem;">
            Candidate Applications
          </h1>
          <p style="color: var(--text-muted);" id="applicants-total-count">
            Review applicant resumes, profiles, and update candidate hiring stages.
          </p>
        </div>

        <!-- Filter Controls -->
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <select id="applicant-job-filter" class="form-control" style="width: auto; min-width: 200px;">
            <option value="">All Jobs</option>
          </select>

          <select id="applicant-status-filter" class="form-control" style="width: auto;">
            <option value="All">All Statuses</option>
            <option value="Applied">Applied</option>
            <option value="Under Review">Under Review</option>
            <option value="Shortlisted">Shortlisted</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
            <option value="Withdrawn">Withdrawn</option>
          </select>
        </div>
      </div>

      <div id="applicants-list-container">
        <!-- Rendered by employer.js -->
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/employer.js"></script>
</body>
</html>
