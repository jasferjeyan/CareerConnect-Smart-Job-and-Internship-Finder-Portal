<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post / Edit Job – CareerConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header id="main-header"></header>

  <main class="section-sm">
    <div class="container container-narrow">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem;" id="post-job-heading">
          Post a New Opportunity
        </h1>
        <p style="color: var(--text-muted);">
          Create a job or internship listing to connect with talented students and fresh graduates.
        </p>
      </div>

      <div class="card" style="padding: 2.25rem;">
        <form id="post-job-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="job-title">Job / Internship Title <span class="required">*</span></label>
              <input type="text" id="job-title" class="form-control" placeholder="e.g. Associate Software Engineer, Frontend Intern" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="company-name">Hiring Company Name <span class="required">*</span></label>
              <input type="text" id="company-name" class="form-control" placeholder="e.g. Google India, Razorpay" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="job-category">Category <span class="required">*</span></label>
              <select id="job-category" class="form-control" required>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Data Science & AI">Data Science & AI</option>
                <option value="UI/UX Design">UI/UX Design</option>
                <option value="DevOps & Cloud">DevOps & Cloud</option>
                <option value="Marketing & Sales">Marketing & Sales</option>
                <option value="Product Management">Product Management</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="job-type">Employment Type <span class="required">*</span></label>
              <select id="job-type" class="form-control" required>
                <option value="Full-time">Full-time</option>
                <option value="Internship">Internship</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="workplace-mode">Workplace Mode <span class="required">*</span></label>
              <select id="workplace-mode" class="form-control" required>
                <option value="Onsite">Onsite</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Remote">Remote</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="experience-level">Experience Level</label>
              <select id="experience-level" class="form-control">
                <option value="Fresher">Fresher / Graduate</option>
                <option value="Internship">Internship</option>
                <option value="Entry Level">Entry Level (0-2 yrs)</option>
                <option value="Mid Level">Mid Level</option>
                <option value="Senior Level">Senior Level</option>
                <option value="Any">Any Experience</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="job-location">Location <span class="required">*</span></label>
              <input type="text" id="job-location" class="form-control" placeholder="e.g. Bengaluru, Karnataka or Remote" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="job-salary">Salary / Stipend Info</label>
              <input type="text" id="job-salary" class="form-control" placeholder="e.g. ₹8,00,000 - ₹12,00,000 / yr or ₹40,000 / mo stipend">
            </div>

            <div class="form-group">
              <label class="form-label" for="job-deadline">Application Deadline</label>
              <input type="date" id="job-deadline" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-skills">
              Required Technical Skills <span class="required">*</span>
              <span style="font-weight: 400; color: var(--text-muted);">(Separated by commas)</span>
            </label>
            <input type="text" id="job-skills" class="form-control" placeholder="e.g. JavaScript, React, Node.js, MongoDB, Git" required>
            <small class="form-text">Our skill matching engine uses these to calculate candidate suitability.</small>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-description">Role Description & Overview <span class="required">*</span></label>
            <textarea id="job-description" class="form-control" rows="5" placeholder="Provide a detailed overview of the role, team context, and key objectives..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-responsibilities">Key Responsibilities</label>
            <textarea id="job-responsibilities" class="form-control" rows="4" placeholder="Detail the day-to-day duties and deliverables..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-qualifications">Required Qualifications & Eligibility</label>
            <textarea id="job-qualifications" class="form-control" rows="3" placeholder="Educational degrees, certifications, or year of graduation requirements..."></textarea>
          </div>

          <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="/manage-jobs.html" class="btn btn-outline">Cancel</a>
            <button type="submit" id="submit-job-btn" class="btn btn-primary btn-lg">
              Publish Opportunity
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/employer.js"></script>
</body>
</html>
